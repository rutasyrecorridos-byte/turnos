name: Compilar APK Android

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Iconos, permisos y versión
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: node scripts/patch-android.js

      - name: Sincronizar web y plugins
        run: npx cap sync android

      - name: Firma fija (permite actualizar sin desinstalar)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/Turnos-1.0.${{ github.run_number }}.apk"

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Turnos-1.0.${{ github.run_number }}
          path: dist/*.apk

      - name: Publicar versión (solo con etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
